# HiredeskHR - Nginx Production Reverse Proxy Configuration
# Optimized for Contabo VPS (Ubuntu 22.04 / 24.04 LTS)

server {
    listen 80;
    listen [::]:80;
    server_name hiredeskhr.com www.hiredeskhr.com app.hiredeskhr.com admin.hiredeskhr.com mail.hiredeskhr.com;

    # Redirect all HTTP requests to HTTPS with Let's Encrypt
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hiredeskhr.com www.hiredeskhr.com app.hiredeskhr.com admin.hiredeskhr.com mail.hiredeskhr.com;

    # SSL Certificate (Generated by Certbot)
    ssl_certificate /etc/letsencrypt/live/hiredeskhr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hiredeskhr.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Max body upload size for Candidate Resumes (PDF / DOCX up to 25MB)
    client_max_body_size 25M;

    # Frontend Single Page Application (Static Vite Build)
    root /var/www/hiredeskhr-app/frontend/dist;
    index index.html;

    # Static Assets Caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # API Backend Reverse Proxy (Node.js PM2 on port 5001)
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # Public Career Portal and Frontend Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
